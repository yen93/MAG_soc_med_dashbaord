<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MAG Social Health Score</title>
<meta name="description" content="A health-score dashboard for My Adventure Group's public-facing channels: Instagram, Website, Facebook and LinkedIn." />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div id="scan-overlay" class="scan-overlay" role="status" aria-live="polite">
    <div class="scan-box">
      <div class="scan-mark">MAG</div>
      <ol class="scan-steps" id="scan-steps"></ol>
      <button type="button" id="scan-skip" class="scan-skip">Skip</button>
    </div>
  </div>

  <noscript>
    <div class="noscript-banner">This dashboard needs JavaScript enabled to load and score data/metrics.json.</div>
  </noscript>

  <main id="app" class="app" hidden></main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
